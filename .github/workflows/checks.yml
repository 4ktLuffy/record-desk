name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.9', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-documents.txt reportlab
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr
      - run: python -m unittest discover -s tests -v
      - run: node --check dist/app.js
      - run: node --check dist/inventory.js
      - run: node --check dist/orders.js
      - run: node --check dist/timeline.js
      - run: node tests/test_timeline.js
      - run: node --check dist/pipelines.js
      - run: node --check dist/incidents.js
      - run: node --check dist/reconciliation.js
