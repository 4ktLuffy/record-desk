<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="480" viewBox="0 0 1120 480" role="img" aria-labelledby="title desc">
<title id="title">Where did the revenue go? An incident replay in Record Desk</title>
<desc id="desc">Illustrated seed 17 walkthrough: an incomplete delivery reports 976 dollars instead of 1476. Schema checks pass, four missing payments are found, and a separately verified repair restores 500 dollars.</desc>
<rect width="1120" height="480" rx="20" fill="#132f3d"/>
<g font-family="system-ui,Segoe UI,sans-serif">
<text x="44" y="49" font-size="13" letter-spacing="3" fill="#89d4d4">RECORD DESK / INCIDENT REPLAY</text>
<text x="44" y="102" font-size="38" font-weight="700" fill="#fff">Where did the revenue go?</text>
<text x="44" y="135" font-size="18" fill="#c4dce2">Break a delivery. Follow the evidence. Test a repair.</text>
<rect x="44" y="169" width="322" height="215" rx="12" fill="#fff"/>
<rect x="399" y="169" width="322" height="215" rx="12" fill="#fff"/>
<rect x="754" y="169" width="322" height="215" rx="12" fill="#e7f5ed"/>
<text x="65" y="203" font-size="12" letter-spacing="1" fill="#526575">01 / DELIVERED TOTAL</text>
<text x="65" y="266" font-size="48" font-weight="700" fill="#923c2a">$976</text>
<text x="65" y="305" font-size="16" fill="#375367">Schema passes. Revenue is wrong.</text>
<text x="65" y="341" font-size="15" fill="#526575">East region missing from export.</text>
<text x="420" y="203" font-size="12" letter-spacing="1" fill="#526575">02 / SOURCE EVIDENCE</text>
<text x="420" y="264" font-size="40" font-weight="700" fill="#173f50">4 payments</text>
<text x="420" y="305" font-size="16" fill="#375367">PAY-001 through PAY-004</text>
<text x="420" y="341" font-size="15" fill="#526575">Exact records account for $500.</text>
<text x="775" y="203" font-size="12" letter-spacing="1" fill="#38604b">03 / VERIFIED CANDIDATE</text>
<text x="775" y="266" font-size="48" font-weight="700" fill="#205d40">$1,476</text>
<text x="775" y="305" font-size="16" fill="#38604b">Matches the trusted reference.</text>
<text x="775" y="341" font-size="15" fill="#38604b">Original delivery preserved.</text>
<text x="44" y="424" font-size="15" fill="#c4dce2">Reproducible seed · Source hashes · Record evidence · Isolated candidates · Downloadable audit bundle</text>
<text x="44" y="454" font-size="12" fill="#89aebd">Illustrated walkthrough · Synthetic USD snapshot · Reference assumed trusted · No production accuracy claim</text>
